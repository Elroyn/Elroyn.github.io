
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Background</title>
  <style>
    /* Make the video cover the entire background */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding-top: 20%;
      font-size: 2rem;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <!-- 🔥 Background video -->
  <video autoplay muted loop playsinline class="video-bg">
    <source src="elroyn.gathright copy (1).mp4" type="video/mp4">

  </video>

  <!-- 👑 Foreground content -->
  <div class="content">
    Welcome to My Boss Queen Website
  </div>

</body>
</html>
